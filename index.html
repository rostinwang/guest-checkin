<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校園活動來賓即時報到系統</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .status-checked { background-color: #d1fae5; color: #065f46; }
        .status-unchecked { background-color: #f3f4f6; color: #374151; }
        .status-confirm { background-color: #fef3c7; color: #92400e; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-3 md:p-8">

    <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <div class="flex flex-col md:flex-row justify-between items-center border-b pb-4 mb-6 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">🏫 活動來賓即時報到系統</h1>
                <p class="text-sm text-gray-500 mt-1" id="update-time">最後更新：載入中...</p>
            </div>
            <div class="flex bg-gray-100 p-1 rounded-lg shadow-inner">
                <button id="btn-reception" onclick="switchMode('reception')" class="px-5 py-2.5 rounded-md font-bold text-sm transition cursor-pointer bg-white shadow-xs text-blue-600">
                    🗄️ 接待處登記
                </button>
                <button id="btn-vip" onclick="switchMode('vip')" class="px-5 py-2.5 rounded-md font-bold text-sm transition cursor-pointer text-gray-600 hover:text-gray-900">
                    🏛️ 會場長官席
                </button>
            </div>
        </div>

        <div class="grid grid-cols-3 gap-4 mb-6 text-center">
            <div class="bg-blue-50 p-3 rounded-lg"><p class="text-xs text-blue-600 font-medium">應到人數</p><p id="stat-total" class="text-2xl font-bold text-blue-800">0</p></div>
            <div class="bg-emerald-50 p-3 rounded-lg"><p class="text-xs text-emerald-600 font-medium">已報到</p><p id="stat-present" class="text-2xl font-bold text-emerald-800">0</p></div>
            <div class="bg-gray-50 p-3 rounded-lg"><p class="text-xs text-gray-600 font-medium">未報到</p><p id="stat-absent" class="text-2xl font-bold text-gray-800">0</p></div>
        </div>

        <div class="mb-4">
            <input type="text" id="search-input" oninput="renderTable()" placeholder="🔍 輸入關鍵字搜尋類別、單位、姓名或職稱..." class="w-full px-4 py-2.5 text-base border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
        </div>

        <div class="overflow-x-auto border border-gray-200 rounded-lg shadow-xs">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="px-6 py-4 text-left text-sm font-bold text-gray-600 tracking-wider w-1/4">類別</th>
                        <th class="px-6 py-4 text-left text-sm font-bold text-gray-600 tracking-wider w-1/4">服務單位</th>
                        <th class="px-6 py-4 text-left text-sm font-bold text-gray-600 tracking-wider w-1/5">職稱</th>
                        <th class="px-6 py-4 text-left text-sm font-bold text-gray-600 tracking-wider w-1/5">姓名</th>
                        <th class="px-6 py-4 text-center text-sm font-bold text-gray-600 tracking-wider">狀態 / 介紹控管</th>
                    </tr>
                </thead>
                <tbody id="guest-table-body" class="bg-white divide-y divide-gray-200">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        // ⚠️ 請在此處貼上您的 Google Apps Script 網頁應用程式 URL
        const API_URL = 'https://script.google.com/macros/s/AKfycbxBORwJsP8_kbrkJor7Hvr049DEfSCxXyM0r3DL5xboDq_RXmnE7qPq-y5uvmZF9vkA9w/exec'; 
        
        let guests = [];
        let currentMode = 'reception'; 
        let refreshInterval;
        
        let pendingConfirmId = null;
        let pendingTimeout = null;

        async function init() {
            await fetchGuests();
            switchMode('reception');
            
            refreshInterval = setInterval(() => {
                if (currentMode === 'vip') fetchGuests();
            }, 5000);
        }

        async function fetchGuests() {
            try {
                const response = await fetch(API_URL);
                const newGuests = await response.json();
                
                guests = newGuests.map(ng => {
                    const existing = guests.find(g => g.id === ng.id);
                    return {
                        ...ng,
                        category: (ng.category || '').trim(), // 去除試算表類別的前後空白
                        unit: (ng.unit || '').trim(),
                        title: (ng.title || '').trim(),
                        name: (ng.name || '').trim(),
                        introduced: existing ? existing.introduced : false
                    };
                });

                updateStats();
                renderTable();
                document.getElementById('update-time').innerText = `最後更新：${new Date().toLocaleTimeString()}`;
            } catch (error) {
                console.error('讀取資料失敗:', error);
            }
        }

        function updateStats() {
            const total = guests.length;
            const present = guests.filter(g => g.status === '已報到').length;
            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-present').innerText = present;
            document.getElementById('stat-absent').innerText = total - present;
        }

        function switchMode(mode) {
            currentMode = mode;
            const btnRec = document.getElementById('btn-reception');
            const btnVip = document.getElementById('btn-vip');
            
            if (mode === 'reception') {
                btnRec.className = "px-5 py-2.5 rounded-md font-bold text-sm transition cursor-pointer bg-white shadow-xs text-blue-600";
                btnVip.className = "px-5 py-2.5 rounded-md font-bold text-sm transition cursor-pointer text-gray-600 hover:text-gray-900";
            } else {
                btnVip.className = "px-5 py-2.5 rounded-md font-bold text-sm transition cursor-pointer bg-white shadow-xs text-blue-600";
                btnRec.className = "px-5 py-2.5 rounded-md font-bold text-sm transition cursor-pointer text-gray-600 hover:text-gray-900";
            }
            clearPendingConfirm();
            renderTable();
        }

        function toggleIntroduced(id) {
            const guest = guests.find(g => g.id === id);
            if (guest) {
                guest.introduced = !guest.introduced;
                renderTable();
            }
        }

        function clearPendingConfirm() {
            if (pendingTimeout) {
                clearTimeout(pendingTimeout);
                pendingTimeout = null;
            }
            pendingConfirmId = null;
        }

        function handleReceptionClick(id, currentStatus) {
            if (currentStatus === '已報到') {
                toggleStatus(id, '未報到');
                clearPendingConfirm();
                return;
            }

            if (pendingConfirmId === id) {
                toggleStatus(id, '已報到');
                clearPendingConfirm();
            } else {
                clearPendingConfirm();
                pendingConfirmId = id;
                renderTable(); 
                
                pendingTimeout = setTimeout(() => {
                    pendingConfirmId = null;
                    renderTable();
                }, 2000);
            }
        }

        function renderTable() {
            const tbody = document.getElementById('guest-table-body');
            const keyword = document.getElementById('search-input').value.toLowerCase();
            tbody.innerHTML = '';

            let displayGuests = [...guests];
            
            if (currentMode === 'vip') {
                displayGuests.sort((a, b) => {
                    // 1. 主要排序：已報到的排最上面
                    if (a.status !== b.status) return b.status === '已報到' ? 1 : -1;
                    
                    if (a.status === '已報到') {
                        // 2. 次要排序：完全依據試算表填寫的「類別欄位」進行排序 (例如：01 必然在 02 前面)
                        const catCompare = a.category.localeCompare(b.category, 'zh-Hant');
                        if (catCompare !== 0) return catCompare;
                        
                        // 3. 微調排序一：同類別中，未介紹的排前面
                        if (a.introduced !== b.introduced) return a.introduced ? 1 : -1;
                        
                        // 4. 微調排序二：依單位名稱排序，讓同單位完全貼在一起
                        return a.unit.localeCompare(b.unit, 'zh-Hant');
                    }
                    return 0;
                });
            } else {
                // 接待處模式：依試算表原始輸入順序 (ID)
                displayGuests.sort((a, b) => a.id - b.id);
            }

            displayGuests.forEach(guest => {
                if (guest.category.toLowerCase().includes(keyword) || guest.unit.toLowerCase().includes(keyword) || guest.name.toLowerCase().includes(keyword) || guest.title.toLowerCase().includes(keyword)) {
                    const tr = document.createElement('tr');
                    
                    let actionHtml = '';
                    let rowClass = 'bg-white'; 

                    if (currentMode === 'reception') {
                        if (guest.status === '已報到') {
                            actionHtml = `
                                <button onclick="handleReceptionClick(${guest.id}, '已報到')" 
                                        class="px-4 py-2 text-sm font-bold rounded-full cursor-pointer transition status-checked hover:bg-red-100 hover:text-red-700">
                                    ✓ 已報到
                                </button>`;
                        } else {
                            if (pendingConfirmId === guest.id) {
                                actionHtml = `
                                    <button onclick="handleReceptionClick(${guest.id}, '未報到')" 
                                            class="px-4 py-2 text-sm font-extrabold rounded-full cursor-pointer transition status-confirm shadow-sm animate-bounce">
                                        ❓ 再點一次確認
                                    </button>`;
                            } else {
                                actionHtml = `
                                    <button onclick="handleReceptionClick(${guest.id}, '未報到')" 
                                            class="px-4 py-2 text-sm font-bold rounded-full cursor-pointer transition status-unchecked hover:bg-blue-50 hover:text-blue-600">
                                        未報到
                                    </button>`;
                            }
                        }
                    } else {
                        if (guest.status === '已報到') {
                            if (!guest.introduced) {
                                rowClass = 'bg-amber-50 font-semibold border-l-4 border-amber-500'; 
                                actionHtml = `
                                    <button onclick="toggleIntroduced(${guest.id})" class="px-4 py-2 text-sm font-extrabold rounded-lg bg-blue-600 text-white hover:bg-blue-700 cursor-pointer transition shadow-md">
                                        📢 點此標記已介紹
                                    </button>`;
                            } else {
                                rowClass = 'bg-gray-50 opacity-40';
                                actionHtml = `
                                    <button onclick="toggleIntroduced(${guest.id})" class="px-4 py-2 text-sm font-medium rounded-lg bg-gray-300 text-gray-700 hover:bg-gray-400 cursor-pointer transition">
                                        ✓ 已介紹 (撤銷)
                                    </button>`;
                            }
                        } else {
                            rowClass = 'bg-white opacity-25';
                            actionHtml = `<span class="px-4 py-2 text-sm font-medium text-gray-400">未報到</span>`;
                        }
                    }

                    tr.className = `${rowClass} transition-all duration-300 hover:bg-gray-50/50`;
                    tr.innerHTML = `
                        <td class="px-6 py-4.5 whitespace-nowrap text-base text-gray-500 font-medium">${guest.category}</td>
                        <td class="px-6 py-4.5 whitespace-nowrap text-lg text-gray-900 font-bold tracking-wide">${guest.unit}</td>
                        <td class="px-6 py-4.5 whitespace-nowrap text-base text-gray-600 font-medium">${guest.title}</td>
                        <td class="px-6 py-4.5 whitespace-nowrap text-xl text-gray-900 font-black">${guest.name}</td>
                        <td class="px-6 py-4.5 whitespace-nowrap text-center">${actionHtml}</td>
                    `;
                    tbody.appendChild(tr);
                }
            });
        }

        async function toggleStatus(id, newStatus) {
            const guest = guests.find(g => g.id === id);
            if (guest) {
                guest.status = newStatus;
                updateStats();
                renderTable();
            }

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ id: id, status: newStatus })
                });
            } catch (error) {
                console.error('更新狀態失敗:', error);
                alert('網路連線異常，狀態同步失敗！');
                fetchGuests();
            }
        }

        window.onload = init;
    </script>
</body>
</html>
