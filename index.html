<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校園活動來賓即時報到系統</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .status-checked { background-color: #d1fae5; color: #065f46; }
        .status-unchecked { background-color: #f3f4f6; color: #374151; }
        .status-confirm { background-color: #fef3c7; color: #92400e; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-3 md:p-8">

    <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <div class="flex flex-col md:flex-row justify-between items-center border-b pb-4 mb-6 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">🏫 活動來賓即時報到系統</h1>
                <p class="text-sm text-gray-500 mt-1" id="update-time">最後更新：載入中...</p>
            </div>
            <div class="flex bg-gray-100 p-1 rounded-lg shadow-inner">
                <button id="btn-reception" onclick="switchMode('reception')" class="px-5 py-2.5 rounded-md font-bold text-sm transition cursor-pointer bg-white shadow-xs text-blue-600">
                    🗄️ 接待處登記
                </button>
                <button id="btn-vip" onclick="switchMode('vip')" class="px-5 py-2.5 rounded-md font-bold text-sm transition cursor-pointer text-gray-600 hover:text-gray-900">
                    🏛️ 會場長官席
                </button>
            </div>
        </div>

        <div class="grid grid-cols-3 gap-4 mb-6 text-center">
            <div class="bg-blue-50 p-3 rounded-lg"><p class="text-xs text-blue-600 font-medium">應到人數</p><p id="stat-total" class="text-2xl font-bold text-blue-800">0</p></div>
            <div class="bg-emerald-50 p-3 rounded-lg"><p class="text-xs text-emerald-600 font-medium">已報到</p><p id="stat-present" class="text-2xl font-bold text-emerald-800">0</p></div>
            <div class="bg-gray-50 p-3 rounded-lg"><p class="text-xs text-gray-600 font-medium">未報到</p><p id="stat-absent" class="text-2xl font-bold text-gray-800">0</p></div>
        </div>

        <div class="mb-4">
            <input type="text" id="search-input" oninput="renderTable()" placeholder="🔍 輸入關鍵字搜尋類別、單位、姓名或職稱..." class="w-full px-4 py-2.5 text-base border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
        </div>

        <div id="section-to-introduce" class="hidden mb-8">
            <h2 class="text-lg font-black text-amber-800 bg-amber-50 px-4 py-2 rounded-t-lg border-l-4 border-amber-500 flex justify-between items-center">
                <span>📢 候駕中 / 待介紹來賓 (已到場)</span>
                <span id="count-to-introduce" class="text-sm bg-amber-200 text-amber-900 px-2 py-0.5 rounded-full">0 人</span>
            </h2>
            <div class="overflow-x-auto border-x border-b border-gray-200 rounded-b-lg shadow-xs">
                <table class="min-w-full divide-y divide-gray-200">
                    <tbody id="table-to-introduce" class="bg-white divide-y divide-gray-200"></tbody>
                </table>
            </div>
        </div>

        <div id="section-introduced" class="hidden mb-8">
            <h2 class="text-lg font-bold text-gray-600 bg-gray-100 px-4 py-2 rounded-t-lg border-l-4 border-gray-400 flex justify-between items-center">
                <span>✓ 已完成介紹來賓</span>
                <span id="count-introduced" class="text-sm bg-gray-200 text-gray-700 px-2 py-0.5 rounded-full">0 人</span>
            </h2>
            <div class="overflow-x-auto border-x border-b border-gray-200 rounded-b-lg shadow-xs">
                <table class="min-w-full divide-y divide-gray-200">
                    <tbody id="table-introduced" class="bg-gray-50 divide-y divide-gray-200 opacity-60"></tbody>
                </table>
            </div>
        </div>

        <div id="section-main border border-gray-200 rounded-lg shadow-xs">
            <table class="min-w-full divide-y divide-gray-200" id="main-table">
                <thead class="bg-gray-100" id="main-table-head">
                    <tr>
                        <th class="px-6 py-4 text-left text-sm font-bold text-gray-600 tracking-wider w-1/4">類別</th>
                        <th class="px-6 py-4 text-left text-sm font-bold text-gray-600 tracking-wider w-1/4">服務單位</th>
                        <th class="px-6 py-4 text-left text-sm font-bold text-gray-600 tracking-wider w-1/5">職稱</th>
                        <th class="px-6 py-4 text-left text-sm font-bold text-gray-600 tracking-wider w-1/5">姓名</th>
                        <th class="px-6 py-4 text-center text-sm font-bold text-gray-600 tracking-wider">狀態 / 操作</th>
                    </tr>
                </thead>
                <tbody id="guest-table-body" class="bg-white divide-y divide-gray-200">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        // ⚠️ 請在此處貼上您的 Google Apps Script 網頁應用程式 URL
        const API_URL = 'https://script.google.com/macros/s/AKfycbylEptPnn-QkjDHp3M3inKxCB6kxs9btUn3M8CwX59vWpvzKh5osk-uLbjTfeYvhPt_Hw/exec'; 
        
        let guests = [];
        let currentMode = 'reception'; 
        let refreshInterval;
        
        let pendingConfirmId = null;
        let pendingTimeout = null;

        window.onload = function() {
            init();
        };

        async function init() {
            await fetchGuests();
            switchMode('reception');
            
            refreshInterval = setInterval(() => {
                if (currentMode === 'vip') fetchGuests();
            }, 5000);
        }

        async function fetchGuests() {
            try {
                const response = await fetch(API_URL);
                const newGuests = await response.json();
                
                guests = newGuests.map(ng => {
                    const existing = guests.find(g => g.id === ng.id);
                    return {
                        ...ng,
                        category: (ng.category || '').trim(),
                        unit: (ng.unit || '').trim(),
                        title: (ng.title || '').trim(),
                        name: (ng.name || '').trim(),
                        introduced: existing ? existing.introduced : false
                    };
                });

                updateStats();
                renderTable();
                document.getElementById('update-time').innerText = `最後更新：${new Date().toLocaleTimeString()}`;
            } catch (error) {
                console.error('讀取資料失敗:', error);
            }
        }

        function updateStats() {
            const total = guests.length;
            const present = guests.filter(g => g.status === '已報到').length;
            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-present').innerText = present;
            document.getElementById('stat-absent').innerText = total - present;
        }

        function switchMode(mode) {
            currentMode = mode;
            const btnRec = document.getElementById('btn-reception');
            const btnVip = document.getElementById('btn-vip');
            const secToIntroduce = document.getElementById('section-to-introduce');
            const secIntroduced = document.getElementById('section-introduced');
            const mainTableHead = document.getElementById('main-table-head');
            
            if (mode === 'reception') {
                btnRec.className = "px-5 py-2.5 rounded-md font-bold text-sm transition cursor-pointer bg-white shadow-xs text-blue-600";
                btnVip.className = "px-5 py-2.5 rounded-md font-bold text-sm transition cursor-pointer text-gray-600 hover:text-gray-900";
                secToIntroduce.classList.add('hidden');
                secIntroduced.classList.add('hidden');
                mainTableHead.classList.remove('hidden');
            } else {
                btnVip.className = "px-5 py-2.5 rounded-md font-bold text-sm transition cursor-pointer bg-white shadow-xs text-blue-600";
                btnRec.className = "px-5 py-2.5 rounded-md font-bold text-sm transition cursor-pointer text-gray-600 hover:text-gray-900";
                secToIntroduce.classList.remove('hidden');
                secIntroduced.classList.remove('hidden');
                mainTableHead.classList.add('hidden'); // 長官席隱藏底層綜合表格的表頭
            }
            clearPendingConfirm();
            renderTable();
        }

        function toggleIntroduced(id) {
            const guest = guests.find(g => g.id === id);
            if (guest) {
                guest.introduced = !guest.introduced;
                renderTable();
            }
        }

        function clearPendingConfirm() {
            if (pendingTimeout) clearTimeout(pendingTimeout);
            pendingConfirmId = null;
        }

        function handleReceptionClick(id, currentStatus) {
            if (currentStatus === '已報到') {
                toggleStatus(id, '未報到');
                clearPendingConfirm();
                return;
            }

            if (pendingConfirmId === id) {
                toggleStatus(id, '已報到');
                clearPendingConfirm();
            } else {
                clearPendingConfirm();
                pendingConfirmId = id;
                renderTable(); 
                pendingTimeout = setTimeout(() => {
                    pendingConfirmId = null;
                    renderTable();
                }, 2000);
            }
        }

        // 產生單一行 HTML 的輔助函式
        function createRowHtml(guest, actionHtml) {
            return `
                <td class="px-6 py-4.5 whitespace-nowrap text-base text-gray-500 font-medium w-1/4">${guest.category}</td>
                <td class="px-6 py-4.5 whitespace-nowrap text-lg text-gray-900 font-bold tracking-wide w-1/4">${guest.unit}</td>
                <td class="px-6 py-4.5 whitespace-nowrap text-base text-gray-600 font-medium w-1/5">${guest.title}</td>
                <td class="px-6 py-4.5 whitespace-nowrap text-xl text-gray-900 font-black w-1/5">${guest.name}</td>
                <td class="px-6 py-4.5 whitespace-nowrap text-center">${actionHtml}</td>
            `;
        }

        function renderTable() {
            const keyword = document.getElementById('search-input').value.toLowerCase();
            
            // 取得三個不同區塊的容器
            const tbodyMain = document.getElementById('guest-table-body');
            const tbodyToIntroduce = document.getElementById('table-to-introduce');
            const tbodyIntroduced = document.getElementById('table-introduced');
            
            // 清空舊資料
            tbodyMain.innerHTML = '';
            tbodyToIntroduce.innerHTML = '';
            tbodyIntroduced.innerHTML = '';

            let displayGuests = [...guests];
            let toIntroduceCount = 0;
            let introducedCount = 0;

            if (currentMode === 'vip') {
                // 📊 長官席排序：純粹依照試算表的「類別欄位」及「單位」排序
                displayGuests.sort((a, b) => {
                    const catCompare = a.category.localeCompare(b.category, 'zh-Hant');
                    if (catCompare !== 0) return catCompare;
                    return a.unit.localeCompare(b.unit, 'zh-Hant');
                });

                displayGuests.forEach(guest => {
                    if (guest.category.toLowerCase().includes(keyword) || guest.unit.toLowerCase().includes(keyword) || guest.name.toLowerCase().includes(keyword) || guest.title.toLowerCase().includes(keyword)) {
                        
                        // 只處理「已報到」的貴賓進入長官席區塊
                        if (guest.status === '已報到') {
                            const tr = document.createElement('tr');
                            tr.className = "transition-all duration-300 hover:bg-gray-100/50";
                            
                            if (!guest.introduced) {
                                // 🏢 上半部：未介紹 (高亮色塊)
                                tr.className += " bg-amber-50/60 font-semibold border-l-4 border-amber-500";
                                let actionHtml = `
                                    <button onclick="toggleIntroduced(${guest.id})" class="px-4 py-2 text-sm font-extrabold rounded-lg bg-blue-600 text-white hover:bg-blue-700 cursor-pointer transition shadow-md">
                                        📢 點此標記已介紹
                                    </button>`;
                                tr.innerHTML = createRowHtml(guest, actionHtml);
                                tbodyToIntroduce.appendChild(tr);
                                toIntroduceCount++;
                            } else {
                                // 🎓 下半部：已介紹 (灰色淡出)
                                let actionHtml = `
                                    <button onclick="toggleIntroduced(${guest.id})" class="px-4 py-2 text-sm font-medium rounded-lg bg-gray-300 text-gray-700 hover:bg-gray-400 cursor-pointer transition">
                                        ✓ 已介紹 (撤銷)
                                    </button>`;
                                tr.innerHTML = createRowHtml(guest, actionHtml);
                                tbodyIntroduced.appendChild(tr);
                                introducedCount++;
                            }
                        }
                    }
                });
                
                // 更新長官席的各別小計人數
                document.getElementById('count-to-introduce').innerText = `${toIntroduceCount} 人`;
                document.getElementById('count-introduced').innerText = `${introducedCount} 人`;

            } else {
                // 🗄️ 接待處模式：依試算表原始 ID 順序輸出單一表格（含未報到）
                displayGuests.sort((a, b) => a.id - b.id);
                
                displayGuests.forEach(guest => {
                    if (guest.category.toLowerCase().includes(keyword) || guest.unit.toLowerCase().includes(keyword) || guest.name.toLowerCase().includes(keyword) || guest.title.toLowerCase().includes(keyword)) {
                        const tr = document.createElement('tr');
                        tr.className = "bg-white transition-all duration-300 hover:bg-gray-50/50";
                        
                        let actionHtml = '';
                        if (guest.status === '已報到') {
                            actionHtml = `
                                <button onclick="handleReceptionClick(${guest.id}, '已報到')" class="px-4 py-2 text-sm font-bold rounded-full cursor-pointer transition status-checked hover:bg-red-100 hover:text-red-700">
                                    ✓ 已報到
                                </button>`;
                        } else {
                            if (pendingConfirmId === guest.id) {
                                actionHtml = `
                                    <button onclick="handleReceptionClick(${guest.id}, '未報到')" class="px-4 py-2 text-sm font-extrabold rounded-full cursor-pointer transition status-confirm shadow-sm animate-bounce">
                                        ❓ 再點一次確認
                                    </button>`;
                            } else {
                                actionHtml = `
                                    <button onclick="handleReceptionClick(${guest.id}, '未報到')" class="px-4 py-2 text-sm font-bold rounded-full cursor-pointer transition status-unchecked hover:bg-blue-50 hover:text-blue-600">
                                        未報到
                                    </button>`;
                            }
                        }
                        
                        // 若已報到，在接待處也給予淡綠色底提示
                        if(guest.status === '已報到') tr.className = "bg-emerald-50/30 hover:bg-gray-50/50";
                        
                        tr.innerHTML = createRowHtml(guest, actionHtml);
                        tbodyMain.appendChild(tr);
                    }
                });
            }
        }

        async function toggleStatus(id, newStatus) {
            const guest = guests.find(g => g.id === id);
            if (guest) {
                guest.status = newStatus;
                updateStats();
                renderTable();
            }

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ id: id, status: newStatus })
                });
            } catch (error) {
                console.error('更新狀態失敗:', error);
                alert('網路連線異常，狀態同步失敗！');
                fetchGuests();
            }
        }
    </script>
</body>
</html>
